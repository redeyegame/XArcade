<script>
'use strict';

const RUNTIME_ERRORS=[];
addEventListener('error',e=>{if(e.error||e.message)RUNTIME_ERRORS.push(String(e.error&&e.error.stack||e.message||e.error));});
addEventListener('unhandledrejection',e=>RUNTIME_ERRORS.push(String(e.reason&&e.reason.stack||e.reason||'unhandled rejection')));

const VERSION='fts-arcade-floor-1.1.1-fixture-facelift';
const TAU=Math.PI*2, DEG=Math.PI/180;
// Dimensional contract: 1 engine unit = 1 inch.
// =============================================================================
// 0.7.0 FEEL PASS
//   RING.outer      430 -> 510   +80 in of floor radius on every heading
//   RING.ceil       132 -> 192   +60 in of headroom (11 ft room)
//   KINETIC.jumpVel 132 -> 156   apex 22.6 -> 31.5 in, hang 0.68 -> 0.81 s
//   SPEED_RUN       387.2        22 mph, UNCHANGED (locked by runSpeed22mph)
//   Cabinet placement UNCHANGED  (locked by cabinetLayoutFrozen against a
//                                 signature snapshotted from 0.6.4)
// Deliberately NOT done this pass: no new cabinets, no agility gates, no
// re-packing of the pods. Walk the wider ring first, then author from feel.
// =============================================================================
const RING={outer:510,inner:118,sides:32,ceil:192};
const PLAYER_R=11,PLAYER_H=74,EYE=69,CROUCH_EYE=44,SPEED_WALK=84,SPEED_RUN=387.2,ACCEL=10; // 22 mph sprint - LOCKED
const KINETIC={
 simHz:60,walkSpeed:SPEED_WALK,sprintSpeed:SPEED_RUN,crouchSpeed:58,strafeFactor:.90,reverseFactor:.72,
 accelLambda:12,brakeLambda:18,reverseLambda:10,baseFov:76*Math.PI/180,sprintFov:84*Math.PI/180,
 crouchFov:74*Math.PI/180,slideFov:82*Math.PI/180,jumpVel:156,gravity:386,

 // 0.8.1 APEX-STYLE SLIDE MODEL
 // Sliding is speed/state driven rather than a canned crouch dash. A grounded
 // slide needs real run momentum; an airborne crouch can buffer a landing slide.
 // The first simulation frame gets a small speed boost, then drag ramps up as
 // momentum falls. Jumping out preserves the horizontal velocity instead of
 // immediately snapping it back toward the ground movement target.
 slideMinSpeed:198,slideLandMinSpeed:92,slideLandMinDownVel:72,
 slideExitSpeed:86,slideMaxTime:1.35,slideBoostSpeed:24,slideMaxSpeed:424,
 slideFastFriction:.72,slideSlowFriction:4.8,slideSteerLambda:2.0,slideSteerScale:.20,
 slideRearmDelay:.34,slideJumpCarry:.985,
 airAccelLambda:2.35,airBrakeLambda:.45,airSpeedCap:438,airDrag:.055,

 stanceLambda:18,fovLambda:8,maxCatchupSteps:8
};
// Derived jump numbers, so tuning conversations happen in apex/hang-time/reach
// instead of re-deriving v^2/2g by hand every time someone touches jumpVel.
//   apex     peak height of the feet above the floor, inches
//   hang     total airtime, seconds
//   reach    horizontal distance covered by a full-speed sprint jump, inches
const JUMP={
 apex:KINETIC.jumpVel*KINETIC.jumpVel/(2*KINETIC.gravity),
 hang:2*KINETIC.jumpVel/KINETIC.gravity,
 get reach(){return KINETIC.sprintSpeed*this.hang;}
};
// Render ranges are derived from the ring instead of hardcoded. 0.6.4 carried
// literal 860 (solid cull, = 2 x the old 430 outer) and 780 (fog far). Left
// alone, a 510 ring would have culled far-wall dressing mid-room and crushed
// the far side to full shadow.
//   solidCull  cabinets/fixtures past this distance are skipped entirely
//   fogFar     distance at which shading reaches the darkest shade band
// fogFar scales with the ring so the falloff *ratio* matches 0.6.4. If the room
// should instead read as genuinely bigger and darker at the rim, hardcode 780.
const RENDER={solidCull:2*RING.outer,fogFar:Math.round(RING.outer*(780/430))};
// 0.8.0: spend geometry only where the camera can see it. The 0.7.0 sweep peaked
// near 23 wall spans per screen column, so start at 40x width and grow only if a
// future scene proves it necessary instead of permanently reserving 120x.
const PERF={
 wallSpanFactor:40,wallSpanMaxFactor:80,
 cabinetNear:220,cabinetMid:390,frustumPad:1.30,
 coarseScale:2.15,coarseTallScale:2.45
};
const CABINET_DIM={w:40,d:40,h:78,control:40,screenBayTop:68.5,screenCenter:55.5,screenW:35,controlW:36.5,controlD:17.5};
const AISLE={secondary:47.25,primary:70.87,merge:141.73}; // 1.2m / 1.8m / 3.6m references, inches
const FOV=KINETIC.baseFov,NEAR=.6,SHADES=11,TILE_H=256,LOOK_UP=180,LOOK_DOWN=320;
const MOUSE_LOOK_SENS=.0021,TOUCH_LOOK_SENS=.00235;
// Horizontal-plane architecture:
// - PATTERN: fast CanvasPattern transform path for browsers that execute it correctly.
// - SOFTWARE: explicit world -> texel scanline rasterizer; no DOMMatrix / pattern mutation.
// iOS/iPadOS defaults to SOFTWARE because all iOS browsers share WebKit's Canvas backend.
const PLATFORM={
 ua:(navigator&&navigator.userAgent)||'',
 ios:/iP(?:hone|ad|od)/.test((navigator&&navigator.userAgent)||'')||(/Macintosh/.test((navigator&&navigator.userAgent)||'')&&((navigator&&navigator.maxTouchPoints)||0)>1)
};
const PLANE_BACKEND={requested:'auto',active:PLATFORM.ios?'software':'pattern'};
function setPlaneBackend(mode){const m=String(mode||'auto').toLowerCase();PLANE_BACKEND.requested=(m==='software'||m==='pattern')?m:'auto';PLANE_BACKEND.active=PLANE_BACKEND.requested==='auto'?(PLATFORM.ios?'software':'pattern'):PLANE_BACKEND.requested;return PLANE_BACKEND.active;}
function togglePlaneBackend(){return setPlaneBackend(PLANE_BACKEND.active==='software'?'pattern':'software');}
// Mapping is world-locked by default, matching the correct desktop presentation.
// 'sector' is retained as an alternate art direction. 'kaleido' is now explicit,
// deterministic, and independent of browser bugs: it rotates each sector's material
// basis with camera yaw around that sector's own center.
const PLANE_MAPPING={mode:'world'};
function setPlaneMappingMode(mode){const m=String(mode||'world').toLowerCase();PLANE_MAPPING.mode=(m==='sector'||m==='kaleido'||m==='view')?(m==='view'?'kaleido':m):'world';return PLANE_MAPPING.mode;}
function togglePlaneMapping(){return setPlaneMappingMode(PLANE_MAPPING.mode==='kaleido'?'world':'kaleido');}
const PORTALS={
 lobby:'https://frymatic.us/FTSArcade/REDEYE',
 theaters:'https://frymatic.us/FTSArcade/REDEYE',
 redeye:'https://frymatic.us/FTSArcade/REDEYE/',
 tokens:'https://frymatic.us/FTSArcade/tokens/',
 adDeal:'https://frymatic.us/menu/gas-works.html'
};

// 0.9.0 SPATIAL CROWDSCAPE ------------------------------------------------------
// Schematic contract: I=north, II=east, III=south, IV=west. The dominant axis
// assigns the player to a quadrant; diagonal boundaries are stable and symmetric.
const CROWD_AUDIO_URL='crowd.mp3';
const CROWD_QUADRANTS=['I','II','III','IV'];
const CROWD_OPPOSITE={I:'III',II:'IV',III:'I',IV:'II'};
const CROWD_ZONE_POSES={
 I:{x:0,y:RING.outer*.67},
 II:{x:RING.outer*.67,y:0},
 III:{x:0,y:-RING.outer*.67},
 IV:{x:-RING.outer*.67,y:0}
};
function crowdQuadrantAt(x,y){
 const ax=Math.abs(x),ay=Math.abs(y);
 if(ay>=ax)return y>=0?'I':'III';
 return x>=0?'II':'IV';
}
function crowdDesiredFor(q){return CROWD_QUADRANTS.filter(k=>k!==CROWD_OPPOSITE[q]);}

// 0.9.2 FLUSH KOI ROOF -------------------------------------------------------
// 0.9.1 re-expressed every point in its school's centroid frame and then scaled
// the radial deviation by 0.08 into a 16in vertical slab. That crushed a ring-wide
// swirl into a thin filament hanging under the ceiling.
//
// MEASURED, not assumed: the source equation is already a donut. Over 600 s of
// sketch time hypot(x,y) spans 57.4..139.6 (median 99), and each school is a ~105
// degree arc; the two schools sit on opposite sides. So 0.9.2 keeps the sketch's
// polar ANGLE untouched and maps its RADIUS linearly onto the real ceiling annulus.
//
// THE ANNULUS IS NOT ROUND: the outer edge is a 32-gon (r=RING.outer) but the inner
// edge is a SQUARE of half-side RING.inner (see innerSquarePoint). Its radius runs
// 118 on the axes to ~167 on the diagonals, so the inner limit is angle-dependent.
//
// Points sit ON the ceiling plane (CELESTIAL_KOI.flush inches below it). Tunables
// are N=1 first-pass hypotheses: judge them by walking under the roof.
const CELESTIAL_KOI={
 enabled:true,
 sourceCount:10000,
 sampleCount:Math.max(200,Math.min(10000,(+new URLSearchParams(location.search).get('koiN'))||4000)), // 960 -> 4000; ?koiN=NNNN overrides (200..10000). ~0.25 ms per 1000 pts measured, headless
 sketchRLo:62,         // sketch radius that lands on the inner limit (envelope 57.4..139.6; <0.5% clip)
 sketchRHi:136,        // sketch radius that lands on the outer limit (p5..p95 = 73..125 -> ~70% of width)
 marginIn:22,          // in, measured along the ray, kept clear of the core walls
 marginOut:20,         // in, kept clear of the outer wall
 flush:1.2,            // in below the ceiling plane
 timeScale:.18,
 pointAlpha:.34,
 streakAlpha:.085,
 pointWorld:2.1,       // world-space dot radius (in)
 minPointPx:.55,
 maxPointPx:1.7,
 streakWorld:9,        // in of trail behind each streaked point
 maxStreakPx:7,
 slackAbs:8,           // depth-test tolerance: abs (in) + rel * depth
 slackRel:.06
};
const CELESTIAL_KOI_MAP={outerR:RING.outer*Math.cos(Math.PI/RING.sides)-CELESTIAL_KOI.marginOut};
function buildCelestialKoiSamples(){
 const out=[],n=CELESTIAL_KOI.sampleCount,max=CELESTIAL_KOI.sourceCount-1;
 for(let j=0;j<n;j++){
  const i=Math.round((j/(n-1))*max),y=i/299,k=(4+Math.cos(y))*Math.cos(i/7),e=y/5-11,d=Math.hypot(k,e)-6;
  out.push({
   index:j,i,y,k,e,d,school:i&1,
   baseQ:99+3*Math.sin(k*2)+(y/23)*k*(e+Math.sin(-d*4)),
   d2:d*d,
   cBase:d/4+(i&1)*9,
   shimmer:.72+.28*Math.sin(i*12.9898)
  });
 }
 return out;
}
const CELESTIAL_KOI_SAMPLES=buildCelestialKoiSamples();
const CELESTIAL_KOI_FRAME={time:NaN,x:new Float32Array(CELESTIAL_KOI.sampleCount),y:new Float32Array(CELESTIAL_KOI.sampleCount)};
const CELESTIAL_KOI_STATS={visible:0,streaks:0};
function setCelestialKoi(v){CELESTIAL_KOI.enabled=!!v;return CELESTIAL_KOI.enabled;}
function toggleCelestialKoi(){return setCelestialKoi(!CELESTIAL_KOI.enabled);}
// Sketch-space positions for one instant. Cached per time so tests and paint agree.
function updateCelestialKoiFrame(time){
 const F=CELESTIAL_KOI_FRAME;if(F.time===time)return F;F.time=time;
 for(const s of CELESTIAL_KOI_SAMPLES){
  const q=s.baseQ+s.d2*Math.sin(time*2-s.d),c=s.cBase-time/4+Math.sin(time*3+s.e)/9;
  F.x[s.index]=q*Math.sin(c);F.y[s.index]=q*Math.cos(c);
 }
 return F;
}
// Inner limit along the unit ray (ux,uy): the square core wall plus margin.
function celestialKoiInnerR(ux,uy){return RING.inner/Math.max(Math.abs(ux),Math.abs(uy),1e-6)+CELESTIAL_KOI.marginIn;}
function celestialKoiPoint(sample,time,frame){
 const K=CELESTIAL_KOI,F=frame||updateCelestialKoiFrame(time),sx=F.x[sample.index],sy=F.y[sample.index],r0=Math.hypot(sx,sy)||1,ux=sx/r0,uy=sy/r0;
 const t=Math.max(0,Math.min(1,(r0-K.sketchRLo)/(K.sketchRHi-K.sketchRLo))),rIn=celestialKoiInnerR(ux,uy),rw=rIn+t*(CELESTIAL_KOI_MAP.outerR-rIn);
 // tx,ty = counter-clockwise tangent: the direction the school travels.
 return{x:ux*rw,y:uy*rw,z:RING.ceil-K.flush,r:rw,tx:-uy,ty:ux,t};
}
function projectWorldPoint(sim,d,p){
 const v=d.view,dx=p.x-sim.x,dy=p.y-sim.y,tx=dx*v.sinA-dy*v.cosA,tz=dx*v.cosA+dy*v.sinA;
 if(tz<=NEAR+1)return null;
 const x=v.halfW+(tx/tz)*v.projDist,y=v.horizon-((p.z-v.pz)*v.projDist)/tz;
 if(x<-3||x>v.w+3||y<-3||y>v.h+3)return null;
 const ix=Math.max(0,Math.min(v.w-1,x|0)),iy=Math.max(0,Math.min(v.h-1,y|0)),occ=d.pixelDepth[iy*v.w+ix];
 // Depth buffer holds forward depth (tz) for flats AND walls, so this is a real
 // test: a point is hidden only if geometry sits meaningfully in front of it.
 if(Number.isFinite(occ)&&tz>occ+CELESTIAL_KOI.slackAbs+CELESTIAL_KOI.slackRel*tz)return null;

function buildLevel(){
 const map=MapBuilder.build(ringDefs());
 for(const ln of map.lines){
  if(ln.back>=0){ln.blocking=false;ln.upper=MAT.WALL_GOLD;ln.lower=MAT.WALL_GOLD;continue;}
  const a=map.verts[ln.v1],b=map.verts[ln.v2],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  if(Math.max(Math.abs(mx),Math.abs(my))<RING.inner+14){ln.mid=MAT.OFFICE_DARK;ln.tag='OFFICE_CORE';}
  else{const ang=Math.atan2(my,mx);ln.mid=Math.abs(Math.sin(ang*3))>.72?MAT.WALL_BLACK_GOLD:MAT.WALL_RIB;ln.tag='OUTER_WALL';}
 }
 // Radial shift, now used ONLY by the three world exits (see AUTHORING.perimeter).
 // Amenities, ad windows and posters mount flush from facet geometry instead.
 const wallShift=RING.outer-AUTHORING.perimeter.authoredOuter;
 const wallR=r=>r+wallShift;
 const addCab=(letter,x,y,ang)=>{const row=CABINET_ROSTER.find(r=>r[0]===letter),slot=CABINET_ROSTER.findIndex(r=>r[0]===letter)+1,c=cabinetSolid(letter,slot,x,y,ang,row[1],row[2],row[3],row[4]);map.solids.push(c);map.cabinets.push(c);if(c.url)map.targets.push(c);};
 const sideSep=(CABINET_DIM.w+AUTHORING.packing.sideGap)/2;
 const backSep=(CABINET_DIM.d+AUTHORING.packing.backGap)/2;
 const pod4=(def)=>{const ang=def.deg*DEG,f={x:Math.cos(ang),y:Math.sin(ang)},r={x:Math.sin(ang),y:-Math.cos(ang)};def.front.forEach((L,i)=>{const rs=i?sideSep:-sideSep;addCab(L,def.cx+f.x*backSep+r.x*rs,def.cy+f.y*backSep+r.y*rs,ang);});def.back.forEach((L,i)=>{const rs=i?sideSep:-sideSep;addCab(L,def.cx-f.x*backSep+r.x*rs,def.cy-f.y*backSep+r.y*rs,ang+Math.PI);});};
 AUTHORING.cabinetPods.forEach(pod4);
 AUTHORING.cabinetSingles.forEach(c=>addCab(c.letter,c.x,c.y,c.deg*DEG));
 AUTHORING.cabinetAdditions.forEach(c=>{const a=c.deg*DEG;addCab(c.letter,Math.cos(a)*c.r,Math.sin(a)*c.r,a+Math.PI);});

 // ---- 1.1.0 wall mounting -------------------------------------------------------------------
 // Outer wall = the 32 flat facets (facet i centred on (i+.5)*11.25 deg). Core = the four faces of the
 // office block. Poses are DERIVED from that geometry, so every mount is flush by construction and the
 // tests can prove it. (The 1.0.0 polar placement left posters ~10 in and vending ~40 in off the wall.)
 const WALL_CLEAR=.25;
 const facetFrame=i=>{const am=(i+.5)*TAU/RING.sides;return{am,apo:RING.outer*Math.cos(Math.PI/RING.sides),nx:Math.cos(am),ny:Math.sin(am),tx:-Math.sin(am),ty:Math.cos(am)};};
 const outerPose=(facet,off,depth)=>{const f=facetFrame(facet),r=f.apo-WALL_CLEAR-depth/2;return{x:f.nx*r+f.tx*off,y:f.ny*r+f.ty*off,ang:f.am+Math.PI};};
 const corePose=(face,off,depth)=>{const c=RING.inner+depth/2;return face==='N'?{x:off,y:c,ang:Math.PI/2}:face==='S'?{x:off,y:-c,ang:-Math.PI/2}:face==='E'?{x:c,y:off,ang:0}:{x:-c,y:off,ang:Math.PI};};

 const addPortalPanel=(d)=>{const pose={x:d.x,y:d.y,ang:d.deg*DEG};const p=panelSolid(d.id,pose.x,pose.y,pose.ang,d.w,d.z0,d.z1,MAT[d.mat],{kind:'dressing',label:d.label,url:d.url||'',cta:d.cta||'OPEN',target:'_blank',mount:'core'});map.solids.push(p);map.fixtures.push(p);if(p.url)map.targets.push(p);return p;};
 AUTHORING.wallPortals.forEach(addPortalPanel);
 AUTHORING.officeEntry.forEach(d=>{if(d.id==='OFFICE_DOOR'){map.solids.push(panelSolid(d.id,d.x,d.y,d.deg*DEG,d.w,d.z0,d.z1,MAT[d.mat],{collision:false,label:d.label,mount:'core'}));}else addPortalPanel(d);});

 // Amenities: flat wall panels, floor to art height (ids, kinds and the token link are unchanged from 1.0.0).
 AUTHORING.amenities.forEach(a=>{const F=artSize(a.art),p=outerPose(a.facet,a.off||0,2),b=panelSolid(a.id,p.x,p.y,p.ang,F.w,0,F.h,MAT['FIX_'+a.art],{kind:a.kind||'fixture',label:a.label,url:a.url||'',target:'_blank',cta:a.cta||'OPEN',mount:'outer',art:a.art});map.solids.push(b);map.fixtures.push(b);if(b.url)map.targets.push(b);});

 // Every poster is content inventory: art + destination + CTA live in AUTHORING.posters.
 AUTHORING.posters.forEach((d,i)=>{const F=artSize(d.art),z0=AUTHORING.posterCenterZ-F.h/2,core=d.wall==='core',pose=core?corePose(d.face,d.off,2):outerPose(d.facet,d.off||0,2),p=panelSolid('POSTER_'+String(i+1).padStart(2,'0'),pose.x,pose.y,pose.ang,F.w,z0,z0+F.h,MAT['FIX_'+d.art],{kind:'dressing',label:d.label,url:d.url,cta:d.cta,target:'_blank',mount:core?'core':'outer',art:d.art});map.solids.push(p);map.fixtures.push(p);map.targets.push(p);});

 // Programmatic ad inventory. Every unit has a stable ID and its own deal-form URL. Skinned as food service windows.
 AUTHORING.adFacets.forEach((facet,i)=>{const unit='FTS-RING-'+String(i+1).padStart(2,'0'),F=artSize('SERVICE_WINDOW'),z0=AUTHORING.windowCenterZ-F.h/2,pose=outerPose(facet,0,2),p=panelSolid('AD_'+unit,pose.x,pose.y,pose.ang,F.w,z0,z0+F.h,MAT.FIX_SERVICE_WINDOW,{kind:'ad',label:'AD SPACE '+unit,url:dealUrl(unit),target:'_blank',inventory:unit,cta:'OPEN DEAL FORM',mount:'outer',art:'SERVICE_WINDOW'});map.solids.push(p);map.ads.push(p);map.targets.push(p);});

 // Three world exits: all use absolute URLs and always confirm before navigation.
 const exitDefs=[
  {id:'EXIT_LOBBY',label:'LOBBY / OFF-SITE',url:PORTALS.lobby,target:'_blank',cta:'LEAVE ARCADE',a:0},
  {id:'EXIT_THEATERS',label:'BRAZEN THEATERS / OFF-SITE',url:PORTALS.theaters,target:'_blank',cta:'LEAVE ARCADE',a:Math.PI},
  {id:'EXIT_REDEYE',label:'REDEYE / OFF-SITE',url:PORTALS.redeye,target:'_blank',cta:'LEAVE ARCADE',a:-Math.PI/2}
 ];
 exitDefs.forEach(e=>{const r=wallR(418),x=Math.cos(e.a)*r,y=Math.sin(e.a)*r,face=e.a+Math.PI,s=boxSolid(e.id,x,y,face,72,8,84,MAT.EXIT,MAT.WALL_GOLD,{kind:'exit',label:e.label,url:e.url,target:e.target,cta:e.cta,collision:true});map.solids.push(s);map.exits.push(s);map.targets.push(s);});

}

function basis(a){return{f:{x:Math.cos(a),y:Math.sin(a)},r:{x:Math.sin(a),y:-Math.cos(a)}};}
function obbPush(px,py,s,rad){const b=basis(s.ang),dx=px-s.x,dy=py-s.y,hf=s.d/2+rad,hr=s.w/2+rad;let fr=dx*b.f.x+dy*b.f.y,rr=dx*b.r.x+dy*b.r.y;if(Math.abs(fr)>=hf||Math.abs(rr)>=hr)return null;const pf=hf-Math.abs(fr),pr=hr-Math.abs(rr);if(pf<pr){const q=fr===0?1:Math.sign(fr);fr=q*hf;}else{const q=rr===0?1:Math.sign(rr);rr=q*hr;}return{x:s.x+b.f.x*fr+b.r.x*rr,y:s.y+b.f.y*fr+b.r.y*rr};}
function solidAabb(s){const b=basis(s.ang),hx=Math.abs(b.f.x)*(s.d/2)+Math.abs(b.r.x)*(s.w/2),hy=Math.abs(b.f.y)*(s.d/2)+Math.abs(b.r.y)*(s.w/2);return{x1:s.x-hx,x2:s.x+hx,y1:s.y-hy,y2:s.y+hy};}
